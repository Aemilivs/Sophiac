name: .NET Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    env:
      SOLUTION_PATH: Sophiac.sln
      UI_PROJECT_PATH: src/Sophiac.UI/Sophiac.UI.csproj
      PUBLISH_DIR: ./publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.UI_PROJECT_PATH }} -c Release -o ${{ env.PUBLISH_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: ${{ env.PUBLISH_DIR }}/*