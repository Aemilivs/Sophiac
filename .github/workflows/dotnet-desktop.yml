name: .NET MAUI Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            framework: net9.0-windows10.0.19041
          - os: windows-latest
            rid: win-x86
            framework: net9.0-windows10.0.19041
          - os: macos-latest
            rid: maccatalyst-arm64
            framework: net9.0-maccatalyst


    env:
      SOLUTION_PATH: "./Sophiac.sln"
      UI_PROJECT_PATH: ./src/Sophiac.UI/Sophiac.UI.csproj
      PUBLISH_DIR: ./publish/${{ matrix.rid }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
          cache: false

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore -r ${{matrix.rid}} ${{ env.SOLUTION_PATH }}

      - name: Publish
        run: dotnet publish ${{ env.UI_PROJECT_PATH }} -c Release -r ${{ matrix.rid }} -f ${{ matrix.framework }} -o ${{ env.PUBLISH_DIR }} --self-contained false

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.rid }}
          path: ${{ env.PUBLISH_DIR }}/*