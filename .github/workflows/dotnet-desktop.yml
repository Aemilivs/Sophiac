name: .NET MAUI Desktop CI

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x86
            framework: net8.0-windows10.0.19041
          # - os: macos-latest
          #   rid: maccatalyst-arm64
          #   framework: net8.0-maccatalyst

    env:
      SOLUTION_PATH: "./Sophiac.sln"
      UI_PROJECT_PATH: ./src/Sophiac.UI/Sophiac.UI.csproj
      PUBLISH_DIR: ./publish/${{ matrix.rid }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: false

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore ${{ env.UI_PROJECT_PATH }} -r ${{ matrix.rid }}

      - name: Publish
        run: dotnet publish ${{ env.UI_PROJECT_PATH }} -c Release -r ${{ matrix.rid }} -f ${{ matrix.framework }} -o ${{ env.PUBLISH_DIR }} --self-contained true -p:PublishTrimmed=true

      - uses: actions/upload-artifact@v4
        with:
          name: Sophiac-${{ matrix.rid }}
          path: ${{ env.PUBLISH_DIR }}/Sophiac.UI*


  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sophiac-win-x86
          path: ./publish/win-x86
      - uses: actions/download-artifact@v4
        with:
          name: Sophiac-maccatalyst-arm64
          path: ./publish/maccatalyst-arm64
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            ./publish/win-x86/Sophiac.UI.exe
            ./publish/maccatalyst-arm64/Sophiac.UI